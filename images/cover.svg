<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="A chip touched by probe needles, with force and measure paths looping around it">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4a6b"/>
      <stop offset="1" stop-color="#22304a"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2740"/>
      <stop offset="1" stop-color="#141d31"/>
    </linearGradient>
  </defs>

  <!-- 背景板 -->
  <rect x="34" y="34" width="172" height="172" rx="18" fill="url(#board)" stroke="#8fa2c4" stroke-width="1.6"/>

  <!-- 上排焊盘 -->
  <g fill="#c9d6ee">
    <rect x="86"  y="18" width="8" height="18" rx="2"/>
    <rect x="106" y="18" width="8" height="18" rx="2"/>
    <rect x="126" y="18" width="8" height="18" rx="2"/>
    <rect x="146" y="18" width="8" height="18" rx="2"/>
    <rect x="86"  y="204" width="8" height="18" rx="2"/>
    <rect x="106" y="204" width="8" height="18" rx="2"/>
    <rect x="126" y="204" width="8" height="18" rx="2"/>
    <rect x="146" y="204" width="8" height="18" rx="2"/>
    <rect x="18"  y="86" width="18" height="8" rx="2"/>
    <rect x="18"  y="106" width="18" height="8" rx="2"/>
    <rect x="18"  y="126" width="18" height="8" rx="2"/>
    <rect x="18"  y="146" width="18" height="8" rx="2"/>
    <rect x="204" y="86" width="18" height="8" rx="2"/>
    <rect x="204" y="106" width="18" height="8" rx="2"/>
    <rect x="204" y="126" width="18" height="8" rx="2"/>
    <rect x="204" y="146" width="18" height="8" rx="2"/>
  </g>

  <!-- 芯片本体 -->
  <rect x="66" y="66" width="108" height="108" rx="10" fill="url(#chip)" stroke="#e8eefb" stroke-width="2"/>

  <!-- 芯片内部：四象限（源表的象征） -->
  <g fill="none" stroke="#7fd4c1" stroke-width="1.4" opacity="0.9">
    <path d="M120 76 L120 164"/>
    <path d="M76 120 L164 120"/>
  </g>
  <circle cx="120" cy="120" r="5" fill="#7fd4c1"/>
  <g fill="#e8eefb" opacity="0.85">
    <circle cx="100" cy="100" r="3"/>
    <circle cx="140" cy="100" r="3"/>
    <circle cx="100" cy="140" r="3"/>
    <circle cx="140" cy="140" r="3"/>
  </g>

  <!-- 探针：两根针尖压在焊盘上 -->
  <g stroke="#ffd479" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M100 4 L104 22"/>
    <path d="M152 4 L148 22"/>
  </g>
  <circle cx="104" cy="23" r="2.6" fill="#ffd479"/>
  <circle cx="148" cy="23" r="2.6" fill="#ffd479"/>

  <!-- 激励与测量两条回路 -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M46 200 C20 190 14 150 22 120 C28 96 40 88 58 84" stroke="#ff9f6b"/>
    <path d="M194 40 C220 50 226 90 218 120 C212 144 200 152 182 156" stroke="#8fd0ff"/>
  </g>
  <g fill="#ff9f6b">
    <path d="M58 84 l10 -6 l-2 11 z"/>
  </g>
  <g fill="#8fd0ff">
    <path d="M182 156 l-10 6 l2 -11 z"/>
  </g>
</svg>
